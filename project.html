<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects | Ashvini Jangid</title>
  <meta name="description" content="Live projects by Ashvini Jangid with preview panes and direct links.">
  <meta name="theme-color" content="#141b2b">
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="projects-page">
  <header class="bar">
    <a class="brand panel" href="/">
      <img src="/morty.png" alt="" class="avatar" width="40" height="40">
      <span><strong>Ashvini Jangid</strong><small>Software engineer</small></span>
    </a>
    <nav class="nav panel" aria-label="Main">
      <a href="/"><i class="ph ph-arrow-left" aria-hidden="true"></i>Island</a>
      <a class="nav-cta" href="/resume.pdf" target="_blank" rel="noreferrer"><i class="ph ph-file-text" aria-hidden="true"></i>Resume</a>
    </nav>
  </header>

  <main class="page">
    <section class="page-head">
      <h1>Projects</h1>
      <p>Live sites and tools I built. Each preview loads the real site. Use Open to visit it in a new tab.</p>
    </section>

    <section class="projects-grid" id="projectsGrid" aria-live="polite" aria-busy="true">
      <div class="project-card panel skeleton"></div>
      <div class="project-card panel skeleton"></div>
      <div class="project-card panel skeleton"></div>
    </section>

    <p class="note">Some sites block embedded previews. Use Open to visit them directly.</p>
  </main>

  <script type="module">
    const GITHUB_USER = 'its-ash';
    const STATIC_URLS = [
      'https://fxopspro.com/',
      'https://flavourdiem.com/',
      'https://scenta.in',
      'https://marutiayurveda.in',
      'https://share.ash-tools.store/',
      'https://alanowarinternational.com/'
    ];

    const grid = document.getElementById('projectsGrid');

    const safeUrl = (url) => {
      try {
        const u = new URL(url.trim());
        return ['http:', 'https:'].includes(u.protocol) ? u : null;
      } catch {
        return null;
      }
    };

    const el = (tag, props = {}, ...kids) => {
      const n = Object.assign(document.createElement(tag), props);
      n.append(...kids);
      return n;
    };

    const card = (u) => {
      const open = el('a', { className: 'btn', href: u.href, target: '_blank', rel: 'noreferrer', textContent: 'Open' });
      const frame = el('iframe', { className: 'project-frame', src: u.href, title: `Preview of ${u.hostname}`, loading: 'lazy', referrerPolicy: 'no-referrer' });
      frame.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-popups');
      return el('article', { className: 'project-card panel' }, el('div', { className: 'project-meta' }, el('h2', { className: 'project-title', textContent: u.hostname }), open), frame);
    };

    const repoUrls = async () => {
      const urls = [];
      for (let page = 1; page <= 10; page++) {
        const res = await fetch(`https://api.github.com/users/${GITHUB_USER}/repos?per_page=100&page=${page}`, { headers: { Accept: 'application/vnd.github+json' } });
        if (!res.ok) throw new Error(`GitHub API error ${res.status}`);
        const repos = await res.json();
        urls.push(...repos.map((r) => r.homepage).filter(Boolean));
        if (repos.length < 100) break;
      }
      return urls;
    };

    const show = (urls) => {
      const seen = new Set();
      const list = urls.map(safeUrl).filter((u) => u && !seen.has(u.hostname) && seen.add(u.hostname));
      grid.replaceChildren(...list.map(card));
      if (!list.length) grid.append(el('p', { className: 'error', textContent: 'No projects found.' }));
      grid.setAttribute('aria-busy', 'false');
    };

    try {
      show([...STATIC_URLS, ...(await repoUrls())]);
    } catch (err) {
      show(STATIC_URLS);
      grid.after(el('p', { className: 'note', textContent: `GitHub projects did not load (${err.message}).` }));
    }
  </script>
</body>
</html>
